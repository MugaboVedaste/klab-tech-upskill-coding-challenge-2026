{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register as Manager</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">TaskFlow</div>
    </header>

    <main class="container">
      <h1>Register as Manager</h1>
      {% if error %}
      <div class="notice">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-row">
          <label>Username</label>
          <input type="text" name="username" required />
        </div>

        <div class="form-row">
          <label>First Name</label>
          <input type="text" name="first_name" required />
        </div>

        <div class="form-row">
          <label>Last Name</label>
          <input type="text" name="last_name" required />
        </div>

        <div class="form-row">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>

        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>

        <div class="form-row">
          <label>Department (optional)</label>
          <input type="text" name="department" />
        </div>

        <div class="row">
          <button type="submit" class="btn">Register</button>
        </div>
      </form>

      <div class="links small">
        After submission an administrator will approve your account.
      </div>
    </main>

    <footer class="site-footer">TaskFlow — minimal interface</footer>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
