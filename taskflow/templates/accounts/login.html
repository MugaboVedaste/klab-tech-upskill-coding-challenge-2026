{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">TaskFlow</div>
    </header>

    <main class="container">
      <h1>Login</h1>

      {% if error %}
      <div class="notice">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="form-row">
          <label>Username</label>
          <input type="text" name="username" required />
        </div>

        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>

        <div class="row">
          <button type="submit" class="btn">Login</button>
        </div>
      </form>

      <div class="links small">
        If you are a manager and don't have an account yet,
        <a href="/accounts/register/">register here</a>.
      </div>
    </main>
    <footer class="site-footer">TaskFlow — minimal interface</footer>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
